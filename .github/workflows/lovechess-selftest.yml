name: LOVE CHESS self-test

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: node --check js/pairing/pairing.js
      - name: Pairing regression and performance test
        run: node tests/pairing-perf.mjs
